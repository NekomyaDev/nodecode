name: Linux

# The Linux memory lane: build the organism on SBCL 2.6.8 and hold a working
# shell's resident memory to the justfile's footprint ceilings (`just
# footprint', src/tools/footprint.py): the interactive shell in tmux, a
# scratch HOME with every shipped cell, 40 back-to-back turns against a
# mock provider on the runner, measured from outside every 100 ms. A red
# names the phase that broke its ceiling and what the memory was -- image,
# heap, libraries -- at its highest. Then the release feed over TLS against a
# host gone silent (`just feed-proof'), and the Discord cell driven end to
# end against a loopback Discord (`just discord-qa'). Linux minutes are the
# cheap ones: it runs on every push of a main* or linux* branch, and on demand.
on:
  workflow_dispatch:
    inputs:
      rev:
        description: Commit to measure (defaults to the dispatched ref)
        required: false
        type: string
  push:
    branches: ["main*", "linux*"]

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  footprint:
    name: Hold a working shell to its memory ceilings
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SBCL_VERSION: "2.6.8"
      SBCL_SHA256: "5391773774b94554a015db9f992370d06937fb6f0cdb0b2142281aebef9e96c1"
      QUICKLISP_DIST: "2026-01-01"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rev || github.sha }}

      # tmux is the shell's terminal; SQLite and OpenSSL are what the image
      # opens at every start (the store, cl+ssl); ffmpeg encodes the voice
      # messages the Discord lane's voice-replies scenario holds the bot to.
      - name: Install tmux and the libraries the organism opens
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux libsqlite3-0 libssl3 ffmpeg
          tmux -V

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Cache SBCL
        id: sbcl-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sbcl
          key: sbcl-${{ env.SBCL_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      # The release SBCL's own x86-64 binary, checked against the hash pinned
      # above.
      - name: Install SBCL
        if: steps.sbcl-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/sbcl-$SBCL_VERSION-x86-64-linux-binary.tar.bz2"
          curl -fsSL --retry 3 -o "$tarball" \
            "https://downloads.sourceforge.net/project/sbcl/sbcl/$SBCL_VERSION/sbcl-$SBCL_VERSION-x86-64-linux-binary.tar.bz2"
          echo "$SBCL_SHA256  $tarball" | sha256sum -c -
          tar -xjf "$tarball" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/sbcl-$SBCL_VERSION-x86-64-linux"
          INSTALL_ROOT="$RUNNER_TEMP/sbcl" sh install.sh

      - name: Put SBCL first
        run: |
          echo "$RUNNER_TEMP/sbcl/bin" >> "$GITHUB_PATH"
          echo "SBCL_HOME=$RUNNER_TEMP/sbcl/lib/sbcl" >> "$GITHUB_ENV"
          SBCL_HOME="$RUNNER_TEMP/sbcl/lib/sbcl" "$RUNNER_TEMP/sbcl/bin/sbcl" --version

      - name: Cache quicklisp and the compiled dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/quicklisp
            ~/.cache/common-lisp
          key: quicklisp-${{ env.QUICKLISP_DIST }}-${{ runner.os }}-sbcl-${{ env.SBCL_VERSION }}-${{ hashFiles('src/nodecode.asd') }}
          restore-keys: |
            quicklisp-${{ env.QUICKLISP_DIST }}-${{ runner.os }}-sbcl-${{ env.SBCL_VERSION }}-

      # The release box resolves dependencies through the quicklisp ~/.sbclrc
      # loads, on the dist every build compiles against (a build's own step).
      - name: Install quicklisp on the pinned dist
        run: |
          if [ ! -f ~/quicklisp/setup.lisp ]; then
            curl -fsSLo "$RUNNER_TEMP/quicklisp.lisp" https://beta.quicklisp.org/quicklisp.lisp
            sbcl --noinform --non-interactive --load "$RUNNER_TEMP/quicklisp.lisp" \
              --eval '(quicklisp-quickstart:install)'
          fi
          cat > ~/.sbclrc <<'RC'
          (let ((quicklisp-init (merge-pathnames "quicklisp/setup.lisp" (user-homedir-pathname))))
            (when (probe-file quicklisp-init)
              (load quicklisp-init)))
          RC
          sbcl --noinform --non-interactive \
            --eval "(unless (equal (ql-dist:version (ql-dist:find-dist \"quicklisp\")) \"$QUICKLISP_DIST\") (ql-dist:install-dist \"http://beta.quicklisp.org/dist/quicklisp/$QUICKLISP_DIST/distinfo.txt\" :replace t :prompt nil))" \
            --eval '(format t "~&dist ~a~%" (ql-dist:version (ql-dist:find-dist "quicklisp")))'
          cd src && sbcl --dynamic-space-size 4096 --control-stack-size 8MB --noinform --non-interactive \
            --eval '(push (truename ".") asdf:*central-registry*)' \
            --eval '(ql:quickload "nodecode" :silent t)' \
            --eval '(format t "~&dependencies present~%")'

      - name: Build the shell
        run: just release

      - name: Hold its footprint
        run: just footprint

      # The release feed over real TLS, against a host that goes silent and
      # never closes: the gateway must leave the connection and act on the
      # next label. Over TLS only a deadline bounds that read.
      - name: Prove the release feed leaves a silent connection
        run: just feed-proof

      # The Discord cell against a loopback Discord and a scripted model:
      # threads, reactions, gates, buttons, the picker, files, pairing,
      # resume and catch-up, as a person in the server would see them.
      - name: Drive the Discord cell end to end
        run: just discord-qa
